# =============================================================================
# 集成测试专用配置（DR-031）
#
# ⚠️ 本文件**只用于测试**，与 application.yml 严格分离，两者的差异必须显式写出，
#    否则「测试环境悄悄和生产配置不同」会成为下一个难查的缺陷。
#
# 存在的理由：224 个单元测试全部使用 mock 仓储 + @WebMvcTest 切片，
# 结构上永远测不到「真实 MyBatis + 真实反射构造器 + 真实 TIMESTAMP 列读回」这条路径。
# DR-029 的 javaType="boolean" 缺陷正是从这条路径漏过去的（224 个测试全绿但接口 500）。
#
# 与 application.yml 的差异（逐条）：
#   1. 数据库名  : linkforge      -> linkforge_test   （⚠️ 绝不共用开发库）
#   2. Flyway    : 开发库已迁移过 -> 本库由 Flyway 从 V1 全新建表
#   3. server.port -> 测试不起 web 容器，置 0 表示随机端口
#
# 时区：必须与生产连接串**逐字符一致**（docs/DECISIONS.md DR-032）。
#   connectionTimeZone=UTC + forceConnectionTimeZoneToSession=true
#     => 驱动执行 SET time_zone='+00:00'，数据库会话时区为 UTC
#     => DEFAULT CURRENT_TIMESTAMP 生成 UTC，TIMESTAMP 读回的 LocalDateTime 也是 UTC
#     => 应用层可无条件按 UTC 解释（DR-027）
# ⚠️ 若这里改成 serverTimezone=Asia/Shanghai（或省略 forceConnectionTimeZoneToSession），
#    数据库生成的 created_at 会变成本地墙上时钟，被 TimeConverter 再加一次 8 小时偏移——
#    那条 createdAt 时区断言就会失败。它存在的意义正是守住这个参数不被改回去。
# =============================================================================

spring:
  datasource:
    # 测试库：独立 schema，绝不触碰开发库 linkforge（否则污染 D5/D6 的验证基线）
    url: jdbc:mysql://localhost:3307/linkforge_test?useSSL=false&allowPublicKeyRetrieval=true&connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true&characterEncoding=utf8
    username: ${TEST_MYSQL_USER:linkforge}
    password: ${TEST_MYSQL_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      pool-name: linkforge-test-pool
      maximum-pool-size: 4

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      # ⚠️ **必须用独立的逻辑库（DB 15）**，与本机运行中的应用（DB 0）隔离。
      #
      # 原因（DR-065）：集成测试会**真实地全量重建布隆过滤器**，
      # 而重建的产物是全局 key `shortlink:bloom`（RENAME 原子切换）。
      # 若测试与应用共用 DB 0，测试里的一次重建就会把
      # **本机应用已积累的真实短码的布隆整个覆盖掉**——
      # 表现为「跑完 mvn test 后，应用里自己创建的短码突然全 404」，
      # 而且要等应用的下一次定时重建（1 小时）才自愈。
      #
      # 用同一个 Redis 服务的不同逻辑库，既拿到了隔离，又保留了
      # 「连的是不是生产同款 Redis 7.4」这个属性。
      database: ${TEST_REDIS_DATABASE:15}
      # ⚠️ 测试环境放宽到 1000ms：冷连接 + 上下文初始化会打满 50ms
      #    （实测 SpringBootTest 首条命令即RedisCommandTimeoutException）
      #    ⚠️ **生产 application.yml 保持 50ms 不动**（DR-011）：
      #    那是跳转命令的执行预算，不该被连接建立消耗。
      #    放宽只发生在测试 profile——否则测试会测一个「与生产不同的超时」，
      #    而超时行为正是需要验证的东西之一。
      timeout: 1000ms

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
    # 测试库每次都从 V1 干净迁移，避免历史脏状态影响断言
    clean-disabled: false

server:
  port: 0

# ⚠️ 必须提供 SHORTLINK_BASE_URL，否则 Context 启动失败。
#    RedirectConfig.shortLinkBaseUrl 是 @Value("${SHORTLINK_BASE_URL}") **无默认值**（DR-014/DR-026）：
#    非法或缺失配置必须在启动期暴露，而不是等第一次创建短链才报错。
#    这不是给测试放宽校验，而是把「启动期校验」这条规则如实复现——
#    @SpringBootTest 加载的是完整应用上下文，绕开它反而会让测试环境与生产环境不一致。
SHORTLINK_BASE_URL: http://localhost:8080

# ⚠️ 后台鉴权 token（阶段 4 前置收口）。
#
#    AdminAuthConfig 是**故意 fail-fast** 的：没配 ADMIN_API_TOKEN 就抛异常拒绝启动。
#    那是正确的生产行为（后台接口 /admin/** 绝不能不设防），但它让测试环境
#    **必须**提供这个变量才能启动上下文。
#
#    之前靠宿主机 shell 里的环境变量，干净环境（CI / 新克隆）跑不了；
#    现在固定写在 test profile 里：测试环境的 token 没有保密价值，
#    它只需要「非空且够长」来通过启动期校验。
#
#    ⚠️ 这**不是**在生产配置里放宽校验——生产仍然走环境变量，
#    缺失时依然 fail-fast（见 AdminAuthConfig 的构造器）。
ADMIN_API_TOKEN: test_only_admin_token_for_integration_tests

# ⚠️ 测试环境放宽限流阈值（生产值见 .env / .env.example）。
#
# 原因：集成测试会在**同一个应用上下文**里连着创建十几条短链、连发 20 次跳转，
# 而生产阈值是「创建 10 次/分钟、跳转 20 次/秒」——
# 于是测试会随机地撞上 429（TOO_MANY_REQUESTS），
# 表现为「单跑一个测试类是绿的，跑全量就红」——
# 这是最难查的那种 flaky（限流器自己还有独立的单元测试覆盖，阈值不影响被测行为）。
RATE_LIMIT_REDIRECT_PER_SEC: 1000
RATE_LIMIT_CREATE_PER_MIN: 1000
RATE_LIMIT_QUERY_PER_SEC: 1000
RATE_LIMIT_ADMIN_PER_MIN: 1000

logging:
  level:
    com.linkforge: INFO
    # 集成测试要能看清真实执行的 SQL，否则「断言通过」也不知道在断言什么
    com.linkforge.core.infrastructure.persistence: DEBUG
