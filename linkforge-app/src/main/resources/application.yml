# =============================================================================
# LinkForge 应用配置
#
# 配置原则（12-Factor）：**所有与环境相关的值都从环境变量读取**，本文件不写死任何
# 连接串、账号或密钥。变量清单见项目根目录的 .env.example。
#
# ⚠️ 数据源 URL 只有一个来源：环境变量 SPRING_DATASOURCE_URL（不分 profile）。
#     开发（应用跑在宿主机）：jdbc:mysql://localhost:3307/linkforge?...
#     容器（应用跑在 compose 内）：jdbc:mysql://mysql:3306/linkforge?...
#     宿主机端口是 3307 而非 3306，因为本机 3306 被 MySQL80 占用（docs/DECISIONS.md DR-017）。
# =============================================================================

server:
  # ⚠️ 必须显式声明，不能依赖 Spring Boot 的默认 8080（DR-030）。
  #    .env / .env.example 里的 APP_PORT 此前从未被任何配置消费，是「配了但不生效」的死变量，
  #    而 D3 的启动验证恰好在默认端口上通过，掩盖了这个断链。
  port: ${APP_PORT:8080}

spring:
  application:
    name: linkforge

  datasource:
    # 无默认值：缺失时启动即失败，避免静默连到错误的库
    url: ${SPRING_DATASOURCE_URL}
    username: ${MYSQL_USER}
    password: ${MYSQL_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  flyway:
    enabled: true
    locations: classpath:db/migration
    # 迁移脚本在 linkforge-app/src/main/resources/db/migration
    baseline-on-migrate: false

  # Redis：发号主路径（INCR）、第 2 周起的跳转缓存、布隆过滤器、统计计数、限流
  # host/port 从环境变量读，理由同数据源（12-Factor）：
  #   开发（应用跑在宿主机）：localhost:6379（连容器映射出的端口）
  #   容器（应用跑在 compose 内）：redis:6379（服务名）——localhost 会指向容器自身
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      # 50ms：与 docs/ARCHITECTURE.md §11.3 的超时基线一致。
      # 跳转总预算 P99 < 50ms，Redis 慢于此已无意义，应当立即降级查库而不是继续等。
      timeout: 50ms

mybatis:
  # Mapper XML 在 linkforge-core/src/main/resources/mapper（DR-021）
  mapper-locations: classpath*:mapper/*.xml
  configuration:
    # 数据库列是 snake_case，实体字段是 camelCase
    map-underscore-to-camel-case: true
    # 查询结果缺列时不要静默填 null，早暴露映射错误
    call-setters-on-nulls: true
  type-aliases-package: com.linkforge.core.domain

task:
  scheduling:
    # ⚠️⚠️ **必须是 >1，否则统计定时落库会阻塞其它定时任务**（阶段 3）
    #
    # Spring Boot 的 @Scheduled 默认**单线程**调度：所有 cron 任务共用一个线程，
    # 一个任务没跑完，后面排队的全部不执行。
    # 而统计落库的坏情况会跑很久：MySQL 重试 1s + 4s + 16s，PV/UV 两路各一次 = 42s。
    # 数据库抖动期间，一个 42 秒的落库会**冻住整个调度器**——
    # 阶段 4 的过期清理、阶段 5 的报表聚合全都会被一起拖死。
    #
    # 取 2：一个占位跑统计落库，另一个留给其它任务；
    # 统计落库本身靠 Redis 全局锁保证只有一个实例真正执行，
    # 多线程只是为了让「等锁的那个」不占着唯一线程。
    pool:
      size: 2
    # ⚠️ 优雅停机：关闭应用时最多等 30 秒让正在跑的任务结束。
    #   统计落库一轮最长 45 秒（两次重试退避共 42s + IO），
    #   所以这里只能「尽量等」而不是「等到完」——
    #   等不到的部分不会丢：落库失败会写死信，重启后由 replayDlq 重放。
    shutdown:
      await-termination: true
      await-termination-period: 30s

# =============================================================================
# 统计模块配置（阶段 3）
# =============================================================================
linkforge:
  stats:
    # 异步统计队列容量。压测 1 万条短码语料 × 突发缓冲；调大前先看
    # shortlink.stats.queue.size：长期贴近容量而 dropped{reason=full} 仍为 0，
    # 说明消费端跟得上，加容量只是浪费内存。
    queue-capacity: 10000

    flush:
      # 定时落库 cron：每分钟第 0 秒。
      # ⚠️ 用 cron 而非 fixedRate —— fixedRate 会让「上一轮还没跑完」的任务堆积，
      #    堆积的任务各自抢锁，抢不到就白跑，量级随运行时长不可控。
      cron: "0 * * * * *"

      # 单批从 dirty set SPOP 的短码数。
      # 500 是权衡：太小则往返多（1000 个活跃短码要 2 次 SPOP），
      # 太大则单批落库的数据库事务更长、持锁更久。
      batch-size: 500

      # 单轮最多处理几批。
      # ⚠️ **必须有上限**：SPOP 到空为止在理论上无次数上限，而一批落库最坏
      #   要 45 秒（重试退避 1s+4s+16s × PV/UV 两路）。
      #   无上限会让这一轮长期占着全局锁，后续轮次全部因抢不到锁而空转。
      #   没处理完的数据下一分钟继续——**这不是丢失**，SPOP 只移除已取走的部分。
      max-batches-per-run: 20

      # 回看几天。
      # ⚠️ 不能只处理今天：昨天 23:59 的访问写进「昨天」的 PV key 与 dirty set，
      #   若只看今天，那批数据永远不会落库（昨天不会再变成今天）。
      #   取 2 = 今天 + 昨天，足以覆盖「应用停机 1 天后重启」。
      lookback-days: 2

      # 全局锁 TTL（秒）。
      # ⚠️ **必须 > 单轮最坏耗时**（约 45s）：否则会出现
      #   「A 还在重试、B 已接管锁」的双跑。
      #   双跑本身不致命（取走即删让重复执行幂等），但会白白多打一轮数据库。
      lock-ttl-seconds: 60

      # MySQL 落库失败的重试退避（毫秒，逗号分隔，**必须恰好 3 段** = 重试 3 次）。
      # ⚠️ 1s/4s/16s 是 4 倍增长而非教科书的 2 倍：MySQL 抖动恢复通常是秒级，
      #   指数过大只会白白拉长一轮 flush、逼近锁 TTL。
      #   ⚠️ 若将来调大重试次数，必须**同步调大 lock-ttl-seconds**。
      retry-backoff-ms: 1000,4000,16000

  # =============================================================================
  # 布隆过滤器维护（DR-065）
  # =============================================================================
  bloom:
    # 定时全量重建间隔（毫秒）。默认 1 小时。
    # ⚠️ 启动后**立即**重建一次（ApplicationReadyEvent），本项只管之后的周期性维护。
    rebuild-interval: 3600000

    # 定时任务首次延迟（毫秒）。
    # ⚠️ 默认取「重建间隔」而不是 0：启动那次重建已由启动事件负责，
    #   这里再立刻跑一次只是白扫一遍全库。
    rebuild-initial-delay: 3600000

    # 重建专用 Redis 连接的超时预算（5 秒）。
    # ⚠️ 与 `spring.data.redis.timeout`（50ms）**故意不同**：
    #   50ms 是**跳转命令**的延迟预算（宁可超时降级查库）；
    #   重建是批量写（几千个短码 × 7 个位），用同一个预算必然超时。
    maintenance-timeout: 5s

  # =============================================================================
  # 过期清理（阶段 4）
  # =============================================================================
  cleanup:
    # 清理 cron：每 5 分钟的第 0 秒。
    # ⚠️ 为什么 5 分钟而不是 1 分钟：
    #   跳转路径上本来就有惰性判定（每次请求都检查 expire_at），
    #   所以清理**不是正确性必需**——它只负责释放缓存、让布隆自然淘汰。
    #   过期短链晚 5 分钟被清理，用户侧完全无感（本来就跳不过去）。
    #   而每分钟扫一次 1000 万行的表是纯粹的浪费。
    #   ⚠️ 若业务上要求「过期即刻生效」（比如立刻释放缓存空间），改成 1 分钟。
    cron: "0 */5 * * * *"

    # 单批扫描条数。
    # ⚠️ 走 idx_expire_status (status, expire_at) 索引（V5 迁移），
    #   扫描量与「已过期的短码数」成正比，而不是与总行数成正比。
    batch-size: 1000

    # 单轮最多处理几批。
    # ⚠️ **必须有上限**：无上限会在短链大量到期时让一轮任务持有分布式锁很久，
    #   挤占其它定时任务（统计 flush）。剩下的下一轮继续——
    #   扫描是幂等的（WHERE status=0 会跳过已处理的）。
    max-batches-per-run: 5

    # 清理任务的全局锁 TTL（秒）。
    # ⚠️ **必须 > 单轮最坏耗时**。单轮最多 5 批 × 1000 条，
    #   正常在 1 秒内完成（一次 UPDATE + N 次缓存 DEL）。
    #   60 秒留了很大余量。
    lock-ttl-seconds: 60

logging:
  level:
    com.linkforge: INFO
    # 第 1 周调 SQL 时临时改成 DEBUG 可打印语句与参数
    com.linkforge.core.infrastructure.persistence: INFO

# Actuator：第 2 周起用于读缓存命中率，第 5 周起作为 Prometheus 抓取源
# （spring-boot-starter-actuator 已在 linkforge-redirect 引入，
#   与 shortlink_id_conflict_total 指标同一个 MeterRegistry）
management:
  endpoints:
    web:
      exposure:
        # ⚠️ 刻意只暴露 metrics / health / prometheus，**不开 '*'**。
        # env / configprops / heapdump 会泄露数据库口令、JVM 内存镜像等内容，
        # 本项目没有网络隔离层，必须显式最小化。
        #
        # ⚠️ prometheus 端点（第 5 周新增）：它是 metrics 的**另一种格式**
        # （Prometheus 文本格式而非 JSON），泄露面与 metrics 同级 ——
        # 只含指标名/tag/数值，不含配置项与堆转储。所以可以安全暴露。
        include: metrics,health,prometheus
  endpoint:
    health:
      # 显式暴露 readiness 供 compose healthcheck 用（ROADMAP 第 5 周 TODO 的兑现）：
      # TCP 探测只能证明 Tomcat 起来了，不能证明 MySQL/Redis 可用。
      probes:
        enabled: true
      show-details: never
    prometheus:
      # 显式声明：让「Prometheus 抓取源」这件事在配置文件里可见，
      # 而不是依赖 Boot 的默认值（3.5 默认 true，但默认值不该是「隐式契约」）。
      enabled: true
  metrics:
    tags:
      # 第 5 周 Prometheus 按 application 维度区分时用
      application: linkforge
    # ⚠️⚠️ **绝对不要开 `http.server.requests` 的 `path` tag**
    #
    # Spring Boot 3 的 `http.server.requests` 默认 tag 集合是：
    #   uri（**URI 模板**，如 /{code}）、status、method、outcome、exception
    # 而 `path`（**实际路径**，如 /0000Q0u）默认是**关闭**的。
    #
    # 开了它会怎样：每个被访问过的短码都会成为一个新的 tag 值 →
    #   ① meter 数量随**请求量**线性增长（不是随代码路径增长）
    #   ② 堆持续增长（每个 Meter 都是普通堆对象）
    #   ③ Prometheus 每次抓取要序列化全部 meter，CPU 与内存双重压力
    #   ④ 更糟：Prometheus 自己会因为 series 爆炸而 OOM
    #
    # 本项目的短码是**每条短链唯一**的，`path` 的基数 = 短码总数 = 无界。
    # 这正是 DR-057 怀疑的「Micrometer 动态 Tag」的真实机制 ——
    # 但它影响的是**堆**，不是 Metaspace（类加载）。
    #
    # 若将来确实需要按路径统计，用 `uri`（模板，基数固定）就够了。
    distribution:
      # ⚠️ 分位数直方图：让 P99 能从 Prometheus 侧直接算出来。
      #    没有它，Prometheus 只能拿到 count/sum，P99 要靠应用侧预聚合。
      #
      #    ⚠️ **代价**：每个 Timer 会有几十个 bucket。
      #    本项目 Timer 数量固定（10 个左右），总开销可忽略。
      #
      #    ⚠️ **不配 percentiles**：分位数交给 Prometheus 算（histogram_quantile），
      #    应用侧只暴露 bucket —— 避免应用侧算出 P99 后丢掉了分布信息。
      percentiles-histogram:
        http.server.requests: true
        shortlink.cleanup.duration: true
