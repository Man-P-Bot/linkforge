# =============================================================================
# LinkForge 应用配置
#
# 配置原则（12-Factor）：**所有与环境相关的值都从环境变量读取**，本文件不写死任何
# 连接串、账号或密钥。变量清单见项目根目录的 .env.example。
#
# ⚠️ 数据源 URL 只有一个来源：环境变量 SPRING_DATASOURCE_URL（不分 profile）。
#     开发（应用跑在宿主机）：jdbc:mysql://localhost:3307/linkforge?...
#     容器（应用跑在 compose 内）：jdbc:mysql://mysql:3306/linkforge?...
#     宿主机端口是 3307 而非 3306，因为本机 3306 被 MySQL80 占用（docs/DECISIONS.md DR-017）。
# =============================================================================

server:
  # ⚠️ 必须显式声明，不能依赖 Spring Boot 的默认 8080（DR-030）。
  #    .env / .env.example 里的 APP_PORT 此前从未被任何配置消费，是「配了但不生效」的死变量，
  #    而 D3 的启动验证恰好在默认端口上通过，掩盖了这个断链。
  port: ${APP_PORT:8080}

spring:
  application:
    name: linkforge

  datasource:
    # 无默认值：缺失时启动即失败，避免静默连到错误的库
    url: ${SPRING_DATASOURCE_URL}
    username: ${MYSQL_USER}
    password: ${MYSQL_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  flyway:
    enabled: true
    locations: classpath:db/migration
    # 迁移脚本在 linkforge-app/src/main/resources/db/migration
    baseline-on-migrate: false

  # Redis：发号主路径（INCR）、第 2 周起的跳转缓存、布隆过滤器、统计计数、限流
  # host/port 从环境变量读，理由同数据源（12-Factor）：
  #   开发（应用跑在宿主机）：localhost:6379（连容器映射出的端口）
  #   容器（应用跑在 compose 内）：redis:6379（服务名）——localhost 会指向容器自身
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      # 50ms：与 docs/ARCHITECTURE.md §11.3 的超时基线一致。
      # 跳转总预算 P99 < 50ms，Redis 慢于此已无意义，应当立即降级查库而不是继续等。
      timeout: 50ms

mybatis:
  # Mapper XML 在 linkforge-core/src/main/resources/mapper（DR-021）
  mapper-locations: classpath*:mapper/*.xml
  configuration:
    # 数据库列是 snake_case，实体字段是 camelCase
    map-underscore-to-camel-case: true
    # 查询结果缺列时不要静默填 null，早暴露映射错误
    call-setters-on-nulls: true
  type-aliases-package: com.linkforge.core.domain

logging:
  level:
    com.linkforge: INFO
    # 第 1 周调 SQL 时临时改成 DEBUG 可打印语句与参数
    com.linkforge.core.infrastructure.persistence: INFO
