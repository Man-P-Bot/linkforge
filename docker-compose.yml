# LinkForge 本地依赖环境（MySQL 8.4 + Redis 7.4）
#
# 用法：
#   1. 复制环境变量模板：copy .env.example .env   （或 PowerShell: Copy-Item .env.example .env）
#   2. 启动：docker compose up -d
#   3. 查看状态：docker compose ps   （两者应为 healthy）
#   4. 停止：docker compose down     （加 -v 会连同数据卷一起删除）
#
# 设计约定（见 docs/ARCHITECTURE.md §15、docs/DECISIONS.md DR-001/DR-012）：
#   - 镜像使用固定版本号，不用 latest：PRD A-1 要求「干净环境可复现」，浮动 tag 会让结果随时间漂移。
#   - 数据目录挂在工作区内（docker/*/data），避免写入工作区之外的路径被沙箱拒绝。
#   - MySQL 数据用命名卷（性能更好）；Redis 的 RDB 用绑定挂载（便于确认持久化文件确实生成）。

name: linkforge

services:
  mysql:
    image: mysql:8.4
    container_name: linkforge-mysql
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD 未设置，请先复制 .env.example 为 .env}
      MYSQL_DATABASE: ${MYSQL_DATABASE:?MYSQL_DATABASE 未设置}
      MYSQL_USER: ${MYSQL_USER:?MYSQL_USER 未设置}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD 未设置}
      # ⚠️ 这里设 TZ=Asia/Shanghai 是为了让容器日志与人工排查时看到本地时间，
      #    但它**不影响**应用的时区正确性：应用侧由 JDBC 参数强制会话时区为 UTC
      #    （connectionTimeZone=UTC + forceConnectionTimeZoneToSession=true，见 DR-032），
      #    驱动建连时会执行 SET time_zone='+00:00' 覆盖会话时区。
      #    因此 CURRENT_TIMESTAMP 默认值生成的是 UTC，不是 Asia/Shanghai。
      #
      # ⏳ 第 5 周加 app 服务时的占位提醒：容器内连接串必须写 mysql:3306（不是 3307），
      #    且**同样要带** connectionTimeZone=UTC & forceConnectionTimeZoneToSession=true。
      #    ⚠️ 漏掉这两个参数会让容器内的应用出现 8 小时时区错位，而宿主机跑却正常——
      #    这类「换环境就坏」的缺陷最难排查，本项目已踩过一次（DR-032）。
      TZ: Asia/Shanghai
    ports:
      # 宿主机端口默认 3307：本机 3306 已被宿主机的 MySQL80 服务占用（见 docs/DECISIONS.md DR-017）。
      # 容器内部端口恒为 3306，compose 网络内应连 mysql:3306。
      - "${MYSQL_PORT:-3307}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 5
      # MySQL 首次初始化数据目录较慢，start_period 内失败不计入 retries
      start_period: 30s

  redis:
    image: redis:7.4
    container_name: linkforge-redis
    restart: unless-stopped
    # RDB 持久化：每 60 秒且至少 1000 次写入则落盘（见 docs/ARCHITECTURE.md §15.3）
    command:
      - redis-server
      - --appendonly
      - "no"
      - --save
      - "60 1000"
      - --dir
      - /data
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - ./docker/redis/data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

# ===========================================================================
  # app —— 应用（第 6 天起，见 docs/PERFORMANCE.md §基线口径）
  #
  # 为什么第 1 周就把应用放进容器：第 5 周必然容器化。两周若一个跑宿主 JVM、一个跑容器 JVM，
  # CPU 配额与网络栈不同，优化前后的比值不成立。口径必须从一开始就一致。
  #
  # 启动：docker compose up -d --build app
  # 验证：docker compose logs -f app
  # ===========================================================================
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: linkforge-app:0.1.0
    container_name: linkforge-app
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      # ⚠️ 容器内连 mysql:3306，不是 3307。3307 是宿主机侧的映射端口，
      #    在 compose 网络内服务名 + 容器端口才是正确地址。
      # ⚠️ 时区参数一个都不能少（DR-032）：connectionTimeZone=UTC +
      #    forceConnectionTimeZoneToSession=true。漏掉会出现「宿主机正常、容器内差 8 小时」。
      SPRING_DATASOURCE_URL: "jdbc:mysql://mysql:3306/${MYSQL_DATABASE:?MYSQL_DATABASE 未设置}?useSSL=false&allowPublicKeyRetrieval=true&connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true&characterEncoding=utf8"
      MYSQL_USER: ${MYSQL_USER:?MYSQL_USER 未设置}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD 未设置}
      # redis 是服务名；容器里的 localhost 指向应用容器自身，会连不上（DR-003）
      REDIS_HOST: redis
      REDIS_PORT: 6379
      APP_PORT: 8080
      # 对外基地址：宿主机通过 8080 访问，所以这里仍是 localhost 而非服务名
      SHORTLINK_BASE_URL: ${SHORTLINK_BASE_URL:?SHORTLINK_BASE_URL 未设置}
      ADMIN_API_TOKEN: ${ADMIN_API_TOKEN:?ADMIN_API_TOKEN 未设置}
      RATE_LIMIT_REDIRECT_PER_SEC: ${RATE_LIMIT_REDIRECT_PER_SEC:-20}
      RATE_LIMIT_CREATE_PER_MIN: ${RATE_LIMIT_CREATE_PER_MIN:-10}
      RATE_LIMIT_QUERY_PER_SEC: ${RATE_LIMIT_QUERY_PER_SEC:-60}
      RATE_LIMIT_ADMIN_PER_MIN: ${RATE_LIMIT_ADMIN_PER_MIN:-30}
      CACHE_TTL_SECONDS: ${CACHE_TTL_SECONDS:-3600}
      CACHE_NULL_TTL_SECONDS: ${CACHE_NULL_TTL_SECONDS:-30}
      STATS_DEFAULT_RANGE_DAYS: ${STATS_DEFAULT_RANGE_DAYS:-7}
      STATS_MAX_RANGE_DAYS: ${STATS_MAX_RANGE_DAYS:-90}
      RESERVED_CODES: ${RESERVED_CODES:-api,admin,actuator,health,favicon.ico,static,error}
      # 固定堆 + G1 + GC 日志（D6 决策 Q2）：基线必须可复现，
      # 不固定堆则第 2 周调优时「堆大小」会混进「代码优化」的效果里。
      JAVA_OPTS: "-Xms1g -Xmx1g -XX:+UseG1GC -XX:+PrintGCDetails -Xlog:gc*:file=/dev/stdout:time,uptime,level,tags"
    ports:
      - "${APP_PORT:-8080}:8080"
    healthcheck:
      # 第 2 周起项目已引入 spring-boot-starter-actuator，
      # healthcheck 升级为 /actuator/health/readiness（ROADMAP 第 5 周 TODO 已兑现）。
      # 与之前的 TCP 探测相比，它能证明「MySQL 与 Redis 都可用」，
      # 而不只是「Tomcat 起来了」——依赖不可用时不该让容器显示 healthy。
      #
      # ⚠️ 为什么不用 curl：基础镜像 eclipse-temurin:17-jre-jammy 里没有 curl/wget。
      # 用 bash 的 /dev/tcp 发一个裸 HTTP 请求，零额外依赖。
      test:
        - CMD-SHELL
        - >-
          timeout 3 bash -c 'exec 3<>/dev/tcp/localhost/8080 &&
          printf "GET /actuator/health/readiness HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n" >&3 &&
          head -1 <&3 | grep -q "200"'
      interval: 15s
      timeout: 5s
      retries: 5
      # 首次启动要等 JVM 起来 + Flyway 迁移完成，start_period 内失败不计入 retries
      start_period: 60s

  # ===========================================================================
  # prometheus —— 指标采集（第 5 周）
  #
  # 为什么用「文件挂载」而不是 `command: prometheus --config.file=...` 内联：
  #   配置文件进 git，配置变更可 review、可回滚。
  #   内联在 compose 里会让 yaml 变成一大坨，且 prometheus.yml 无法被 IDE 校验。
  # ===========================================================================
  prometheus:
    image: prom/prometheus:v3.5.0
    container_name: linkforge-prometheus
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      # ⚠️ Web 端点 Basic Auth（第 5 周）：
      #    9090 映射到了宿主机，不开认证的话任何人都能查全部指标、
      #    甚至调 /api/v1/admin/tsdb/delete_series **删历史数据**。
      #    Grafana 有密码而 Prometheus 没有，是不一致的暴露面。
      #    ⚠️ 只保护 Web 端点，**不影响 Prometheus 抓取 app**（抓取不需要认证）。
      - --web.config.file=/etc/prometheus/web.config.yml
      # ⚠️ TSDB 落盘目录：重启后指标不丢（否则重启即「历史曲线消失」）
      - --storage.tsdb.path=/prometheus
      # 保留 15 天。第 5 周的长稳测试要回看 8~24 小时的曲线，够用。
      - --storage.tsdb.retention.time=15d
      # 允许 POST 改配置（reload），改完 prometheus.yml 后
      # `curl -X POST localhost:9090/-/reload` 生效，不用重启容器。
      - --web.enable-lifecycle
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      # ⚠️ web.config.yml 里是 **bcrypt 哈希**（不是明文），所以它可以进 git。
      #    明文密码在 docker/secrets/prometheus_basic_auth.txt（gitignore）。
      - ./docker/prometheus/web.config.yml:/etc/prometheus/web.config.yml:ro
      - prometheus-data:/prometheus
    # ⚠️ 只暴露给宿主机（人看），Prometheus 抓 app 走**容器网络内部**。
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    secrets:
      # ⚠️ healthcheck 需要明文密码（Prometheus 用的是 bcrypt 哈希，
      #    wget 无法用哈希做 Basic Auth）
      - prometheus_basic_auth
    healthcheck:
      # ⚠️ 用 wget 而不是 curl：prom/prometheus 镜像基于 busybox，
      #    有 wget 但没有 curl。
      #
      # ⚠️ **必须带 Basic Auth**：开了 --web.config.file 之后，
      #    连 /-/healthy 这个「健康检查端点」也要认证（实测 401）。
      #    不带凭据的话 healthcheck 永远失败，容器一直显示 unhealthy
      #    ——而 Prometheus 本身完全正常（这是个「假故障」）。
      #
      #    ⚠️ **为什么用 --header 而不是 --user/--password**：
      #    prom/prometheus 镜像是 BusyBox，busybox wget 只有
      #    [-cqS] [--spider] [-O] [-o] [--header] [--post-data] ...
      #    **不支持 --user/--password**（GNU wget 才有）。
      #    实测 busybox 会报 "unrecognized option `--password=...'"。
      #    改用 --header 传 Authorization: Basic <base64>。
      #
      #    ⚠️ 用 $$ 而不是 $：这是 compose 文件，要转义给容器内的 shell。
      # ⚠️ **用单引号包住整条命令**：
      #    命令里有双引号（--header 的值）、单引号（printf 的格式串）、
      #    以及 $$ 转义，三层嵌套在 YAML 折叠后极易引号失衡
      #    （实测报 "syntax error: unexpected end of file"）。
      #    改成「单引号包外层 + printf 用双引号」后就没有歧义了。
      test:
        - CMD-SHELL
        - 'wget --spider -q --header "Authorization: Basic $$(printf "linkforge:%s" $$(cat /run/secrets/prometheus_basic_auth) | base64)" http://localhost:9090/-/healthy'
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - default

  # ===========================================================================
  # grafana —— 看板（第 5 周）
  #
  # ⚠️ **全声明式**：datasource + dashboard 都用 provisioning 文件挂载，
  #    不点 UI。手工在 UI 里配的东西只存在数据库里，换个环境就要重配。
  # ===========================================================================
  grafana:
    image: grafana/grafana:12.1.0
    container_name: linkforge-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      # ⚠️ **密码走 secret 文件，不走环境变量**：
      #    环境变量能被 `docker inspect` 看到，secret 挂载的文件看不到。
      #    Grafana 原生支持 GF_SECURITY_ADMIN_PASSWORD__FILE。
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/grafana_admin_password
      # 禁止自助注册：本项目没有用户体系
      GF_USERS_ALLOW_SIGN_UP: "false"
      # 无外部署时 Grafana 默认不允许外部访问登录页
      GF_SERVER_ROOT_URL: http://localhost:${GRAFANA_PORT:-3000}
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    # ⚠️ entrypoint 包装：Grafana 的 provisioning **不支持环境变量插值**，
    #    数据源密码必须用字面值。entrypoint.sh 在启动前从 secret 读出明文密码，
    #    渲染一份临时 datasource 文件（权限 600）到 /tmp/provisioning。
    #    详见 docker/grafana/entrypoint.sh 的注释。
    entrypoint: ["/bin/sh", "/etc/grafana/entrypoint.sh"]
    secrets:
      - grafana_admin_password
      # Prometheus 的 Basic Auth 明文密码（与 web.config.yml 的 bcrypt 哈希配套）
      - prometheus_basic_auth
    volumes:
      # provisioning：数据源 + 看板提供者声明
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
      # entrypoint 脚本（只读挂载）
      - ./docker/grafana/entrypoint.sh:/etc/grafana/entrypoint.sh:ro
      # 看板 JSON 本体
      - ./docker/grafana/dashboards:/var/lib/grafana/dashboards:ro
      # Grafana 自己的数据（用户、设置、告警状态）持久化
      - grafana-data:/var/lib/grafana
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:3000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    depends_on:
      prometheus:
        condition: service_started
    networks:
      - default

  # ===========================================================================
  # jdk-tools —— 诊断工具容器（**默认不启动**，仅在需要 jcmd 深挖时用）
  #
  # 为什么需要它：
  #   应用镜像用的是 **JRE**（eclipse-temurin:17-jre-jammy），
  #   **不含 JDK 工具**（jcmd / jstack / jmap 都没有）。
  #   而宿主机的 jcmd（Windows）**无法 attach** 到容器内的 JVM
  #   （不同 PID namespace，且宿主是 Windows）。
  #
  # 做法：用 `pid: "service:app"` 让本容器**共享 app 的进程空间**，
  #       再用 `SYS_PTRACE` 能力 attach 进去。
  #   这是 jattach / arthas 官方推荐的跨容器 attach 方式。
  #
  # ⚠️ **用 profile 隔离**：默认 `docker compose up -d` 不会启动它，
  #    也不会拉它的镜像（JDK 镜像比 JRE 大 ~150MB）。
  #    只有真的需要诊断时才用：
  #       docker compose --profile diagnose run --rm --no-deps jdk-tools \
  #           jcmd 1 GC.class_histogram
  #
  # ⚠️ **多数情况下不需要它**：Micrometer 已经暴露了
  #    jvm_classes_loaded_classes（存活类数）与
  #    jvm_classes_unloaded_classes_total（累计卸载数）。
  #    本项目观察到 unloaded_total 恒为 0 ——
  #    即「类加载器从未被回收」⇒ **Metaspace 增长 ≡ 累计加载了新类**，
  #    这在**机制上**就足以判定方向，不需要 jcmd 的快照。
  #    jcmd 只在需要**具体类名分布**时才有不可替代的价值。
  # ===========================================================================
  jdk-tools:
    image: eclipse-temurin:17-jdk-jammy
    container_name: linkforge-jdk-tools
    profiles:
      - diagnose
    # ⚠️ 共享 app 的 PID namespace —— 这样 jcmd 能看到 app 的 JVM 进程
    pid: "service:app"
    # ⚠️ attach 需要 ptrace 能力
    cap_add:
      - SYS_PTRACE
    # 诊断是一次性的，用完即退（不设 restart）
    command: ["jcmd", "help"]
    networks:
      - default

volumes:
  mysql-data:
    name: linkforge-mysql-data
  prometheus-data:
    name: linkforge-prometheus-data
  grafana-data:
    name: linkforge-grafana-data

# =============================================================================
# Docker secrets（第 5 周）
#
# ⚠️ **为什么用 secrets 而不是环境变量**：
#    环境变量能被 `docker inspect` / `docker compose config` 看到明文；
#    secrets 挂载的是文件，容器外看不到内容。
#
# ⚠️ **真实文件不进 git**（.gitignore 已排除 docker/secrets/*），
#    仓库里只有 .example 模板。新机器 clone 后：
#      cp docker/secrets/grafana_admin_password.txt.example \
#         docker/secrets/grafana_admin_password.txt
#      cp docker/secrets/prometheus_basic_auth.txt.example \
#         docker/secrets/prometheus_basic_auth.txt
# =============================================================================
secrets:
  grafana_admin_password:
    file: ./docker/secrets/grafana_admin_password.txt
  prometheus_basic_auth:
    file: ./docker/secrets/prometheus_basic_auth.txt
