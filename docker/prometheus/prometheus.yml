# =============================================================================
# LinkForge Prometheus 抓取配置（第 5 周）
#
# 部署方式：声明式文件挂载 —— 改完 `docker compose restart prometheus` 即生效。
# 不用 `docker exec ... promtool` 手工改，那会让配置漂移出仓库。
# =============================================================================

global:
  # ⚠️ 15 秒采样间隔的三个理由：
  #   ① 压测是 30s/轮，15s 能在每轮内拿到 2 个点，够画趋势；
  #   ② 1s 间隔在 8 万 QPS 下会让 /actuator/prometheus 端点成为显著 CPU 开销
  #      —— 那个端点每次被访问都要**遍历并序列化全部 meter**；
  #   ③ Prometheus 自身的 TSDB 写入量与 series 数成正比，间隔越快增长越快。
  scrape_interval: 15s
  # evaluation_interval 只影响规则计算，本项目暂不配告警规则（用 Grafana 告警）
  evaluation_interval: 15s

  # ⚠️ 外部标签：给所有 series 打上环境标记。
  #    多个环境（开发/压测/生产）共用一个 Prometheus 时，靠它区分。
  external_labels:
    environment: local-compose

scrape_configs:
  # ---------------------------------------------------------------------------
  # 应用
  # ---------------------------------------------------------------------------
  - job_name: 'linkforge'
    metrics_path: '/actuator/prometheus'
    # ⚠️ **必须用服务名 `app:8080`，不能用 localhost**：
    #    容器内的 localhost 指向 Prometheus 容器自身（DR-003 踩过这个坑）。
    #    走 compose 内部网络也避免了宿主机 NAT 带来的额外延迟 ——
    #    压测时若 Prometheus 抓的是映射端口，测出来的延迟包含宿主机转发成本。
    static_configs:
      - targets: ['app:8080']
        labels:
          service: 'linkforge-app'

  # ---------------------------------------------------------------------------
  # Prometheus 自身
  # ---------------------------------------------------------------------------
  # ⚠️ 不抓自己：它不提供 /actuator/prometheus 格式的端点，
  #    且自身指标对排查「Prometheus 是不是瓶颈」有价值，
  #    但需要额外开 --web.enable-lifecycle 之外的自监控配置，收益有限。
  #    真要看 Prometheus 自身资源占用，用 docker stats 更直接。
