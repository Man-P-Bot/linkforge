# 压测专用 overlay：临时放宽限流阈值。
#
# ⚠️ 为什么不直接改 .env：.env 是「生产默认值」的约定（20/s、10/min），
# 改它就得记得改回来——漏一次就会把压测配置带进后续所有运行。
# overlay 只在压测时用 `docker compose -f docker-compose.yml -f docker-compose.bench.yml up`，
# 压完不加载即失效。
#
# ⚠️ 为什么跳转也需要放宽：8 万 QPS 的压测流量必然触发 20/s 的限流，
# 那时测到的会是「限流后的 429 响应」而不是跳转性能。
#
# ⚠️⚠️ LINKFORGE_RATELIMIT_ENABLED=false 会**完全跳过限流 Lua 脚本**，
# 这与「把阈值调到 1000000」是**两件不同的事**：
#   · 阈值调到 100 万 → Lua 每次仍执行（TIME + HMGET + HSET + PEXPIRE），
#     只是不再拒绝。限流的 CPU / Redis 开销**依然存在**
#   · ENABLED=false → 一次 Redis 往返都没有
# 第 3 周压测要测「限流占了多少 QPS」的对照数据时用后者（见 DR-056）。
#
# 默认 true：正式基线数据必须是**带限流**的，那才是生产环境的真实形态。
# 关掉只用于 A/B 对照，压完记得改回来。
services:
  app:
    environment:
      RATE_LIMIT_REDIRECT_PER_SEC: "1000000"
      RATE_LIMIT_CREATE_PER_MIN: "1000000"
      LINKFORGE_RATELIMIT_ENABLED: "${LINKFORGE_RATELIMIT_ENABLED:-true}"