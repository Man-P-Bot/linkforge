# Maven Wrapper 配置
#
# distributionType=only-script：不依赖 wrapper jar，只用脚本解析/下载并缓存 Maven（Maven Wrapper 3.2+ 特性）
# distributionUrl：固定 Maven 3.9.12。
#   实测本机无法访问 Maven Central 与 dlcdn.apache.org，改用可达的阿里云仓库（见 docs/DECISIONS.md DR-016）。
#   已缓存该发行包的机器不会触发下载；缺失时从此地址自动获取。
# wrapperUrl：仅 with-jar 模式使用，only-script 模式不需要。
wrapperVersion=3.3.2
distributionType=only-script
distributionUrl=https://maven.aliyun.com/repository/public/org/apache/maven/apache-maven/3.9.12/apache-maven-3.9.12-bin.zip
